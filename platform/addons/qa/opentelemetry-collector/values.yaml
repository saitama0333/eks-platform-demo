mode: deployment
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib
service:
  enabled: true
  type: ClusterIP
ports:
  otlp: {enabled: true, containerPort: 4317, servicePort: 4317, protocol: TCP}
  otlp-http: {enabled: true, containerPort: 4318, servicePort: 4318, protocol: TCP}
  metrics: {enabled: true, containerPort: 8889, servicePort: 8889, protocol: TCP}
serviceMonitor:
  enabled: true
config:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: 0.0.0.0:4317}
        http: {endpoint: 0.0.0.0:4318}
  processors:
    memory_limiter: {check_interval: 1s, limit_percentage: 75, spike_limit_percentage: 15}
    batch: {}
  exporters:
    otlp/tempo:
      endpoint: tempo.monitoring.svc.cluster.local:4317
      tls: {insecure: true}
    prometheus: {endpoint: 0.0.0.0:8889, namespace: otel}
    debug: {verbosity: basic}
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo, debug]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [prometheus, debug]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
