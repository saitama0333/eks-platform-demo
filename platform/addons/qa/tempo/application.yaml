apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://github.com/saitama0333/eks-platform-demo.git
      targetRevision: develop
      path: artifacts/helm-charts/vendor/tempo
      helm:
        releaseName: tempo
        valueFiles:
          - $values/platform/addons/qa/tempo/values.yaml
    - repoURL: https://github.com/saitama0333/eks-platform-demo.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true




