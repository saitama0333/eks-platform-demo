apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://github.com/saitama0333/eks-platform-demo.git
      targetRevision: develop
      path: artifacts/helm-charts/vendor/aws-load-balancer-controller
      helm:
        releaseName: aws-load-balancer-controller
        valueFiles:
          - $values/platform/addons/dev/aws-load-balancer-controller/values.yaml
    - repoURL: https://github.com/saitama0333/eks-platform-demo.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true




