apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://github.com/saitama0333/eks-platform-demo.git
      targetRevision: develop
      path: artifacts/helm-charts/vendor/opentelemetry-collector
      helm:
        releaseName: opentelemetry-collector
        valueFiles:
          - $values/platform/addons/dev/opentelemetry-collector/values.yaml
    - repoURL: https://github.com/saitama0333/eks-platform-demo.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true




