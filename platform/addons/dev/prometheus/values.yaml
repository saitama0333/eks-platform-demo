grafana:
  enabled: true
  # Temporary overnight scale-down; restore to 1 before bringing dev back online.
  replicas: 1
  # The Grafana PVC is ReadWriteOnce. Stop the old pod before attaching it
  # to a replacement during upgrades and node rollouts.
  deploymentStrategy:
    type: Recreate
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/whitelist-source-range: "58.84.61.197/32"
    hosts:
      - grafana.dev.appledore.in
    tls:
      - secretName: grafana-dev-appledore-tls
        hosts:
          - grafana.dev.appledore.in
  persistence:
    enabled: true
    type: pvc
    storageClassName: gp3-encrypted
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  additionalDataSources:
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3100
      isDefault: false
prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/whitelist-source-range: "58.84.61.197/32"
    hosts:
      - prometheus.dev.appledore.in
    tls:
      - secretName: prometheus-dev-appledore-tls
        hosts:
          - prometheus.dev.appledore.in
  prometheusSpec:
    # Temporary overnight scale-down; Prometheus PVC is retained.
    replicas: 1
    retention: 7d
    retentionSize: 18GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-encrypted
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
alertmanager:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/whitelist-source-range: "58.84.61.197/32"
    hosts:
      - alertmanager.dev.appledore.in
    tls:
      - secretName: alertmanager-dev-appledore-tls
        hosts:
          - alertmanager.dev.appledore.in
  alertmanagerSpec:
    # Temporary overnight scale-down; Alertmanager PVC is retained.
    replicas: 1
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-encrypted
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
