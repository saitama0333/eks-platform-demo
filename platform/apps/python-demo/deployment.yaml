apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-demo
  namespace: default
  labels:
    app.kubernetes.io/name: python-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: python-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: python-demo
    spec:
      containers:
        - name: python-demo
          image: REPLACE_WITH_ECR_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: python-demo
            - name: ENVIRONMENT
              value: dev
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://opentelemetry-collector.monitoring.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: python-demo
  namespace: default
  labels:
    app.kubernetes.io/name: python-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: python-demo
  ports:
    - name: http
      port: 80
      targetPort: http
