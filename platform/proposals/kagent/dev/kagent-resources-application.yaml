apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent-resources
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saitama0333/eks-platform-demo.git
    targetRevision: test-kagent
    path: platform/proposals/kagent/dev
    directory:
      include: kagent-resources.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
