apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent-crds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/kagent-dev/kagent/helm
    chart: kagent-crds
    targetRevision: 0.10.3
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
