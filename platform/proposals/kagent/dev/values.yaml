# Dev read-only operations assistant. Keep the UI private and use kubectl port-forward.
controller:
  replicas: 1
  auth:
    mode: unsecure
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

database:
  postgres:
    bundled:
      enabled: true

providers:
  default: openAI
  openAI:
    provider: OpenAI
    model: gpt-4.1-mini
    apiKeySecretRef: kagent-openai
    apiKeySecretKey: OPENAI_API_KEY

kagent-tools:
  enabled: true
  replicaCount: 1
  tools:
    enabledTools:
      - k8s
    args:
      - --read-only
  rbac:
    create: true
    readOnly: true
    allowSecrets: false
    namespaces:
      - argocd
      - default
      - ingress-nginx
      - monitoring
      - velero
      - kube-system
      - cert-manager
      - external-secrets
      - kagent
    additionalRules:
      - apiGroups:
          - argoproj.io
        resources:
          - applications
          - applicationsets
        verbs:
          - get
          - list
          - watch
      - apiGroups:
          - velero.io
        resources:
          - backups
          - backupstoragelocations
          - deletebackuprequests
          - downloadrequests
          - podvolumebackups
          - podvolumerestores
          - restores
          - schedules
          - serverstatusrequests
          - volumesnapshotlocations
        verbs:
          - get
          - list
          - watch
      - apiGroups:
          - monitoring.coreos.com
        resources:
          - alertmanagers
          - podmonitors
          - prometheuses
          - prometheusrules
          - servicemonitors
          - thanosrulers
        verbs:
          - get
          - list
          - watch

substrate:
  enabled: false
kmcp:
  enabled: false

k8s-agent:
  enabled: false
kgateway-agent:
  enabled: false
istio-agent:
  enabled: false
promql-agent:
  enabled: false
observability-agent:
  enabled: false
argo-rollouts-agent:
  enabled: false
helm-agent:
  enabled: false
cilium-policy-agent:
  enabled: false
cilium-manager-agent:
  enabled: false
cilium-debug-agent:
  enabled: false
grafana-mcp:
  enabled: true
  image:
    registry: docker.io
    repository: grafana/mcp-grafana
    tag: 1.5.0
    pullPolicy: IfNotPresent
  grafana:
    url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local/api
    # This Secret is created by the ExternalSecret in kagent-resources.yaml.
    secretRef: kagent-grafana-readonly
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
