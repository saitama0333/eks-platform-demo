<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NGINX · EKS Platform Demo</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101827; color: #e8edf5; }
      main { max-width: 42rem; margin: 2rem; padding: 3rem; border: 1px solid #334155; border-radius: 1.25rem; background: #182337; box-shadow: 0 24px 80px #0006; }
      .tag { color: #7dd3fc; letter-spacing: .14em; text-transform: uppercase; font-size: .8rem; }
      h1 { margin: .8rem 0; font-size: clamp(2rem, 6vw, 3.5rem); }
      p { color: #b8c4d6; line-height: 1.7; }
      code { color: #a7f3d0; }
    </style>
  </head>
  <body>
    <main>
      <div class="tag">NGINX · Kubernetes · Argo CD</div>
      <h1>Hello from the NGINX demo</h1>
      <p>This static site is served by an unprivileged NGINX container and deployed to Amazon EKS by Argo CD.</p>
      <p>Image builds are tested and scanned in GitHub Actions, pushed to Amazon ECR, and promoted through a reviewed GitOps pull request.</p>
    </main>
  </body>
</html>
