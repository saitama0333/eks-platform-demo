python-tests:
  stage: test
  image: python:3.12-slim
  script:
    - python -m pip install --no-cache-dir -r apps/python-demo/requirements.txt pip-audit
    - python -m unittest discover -s apps/python-demo -p 'test_*.py' -v
    - pip-audit -r apps/python-demo/requirements.txt

java-tests:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn --batch-mode --no-transfer-progress -f apps/java-demo/pom.xml verify
