
server:
  extraArgs:
    - --insecure
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - argocd.dev.appledore.in
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/whitelist-source-range: "58.84.61.197/32"
    tls:
      - secretName: argocd-dev-appledore-tls
        hosts:
          - argocd.dev.appledore.in
    https: false
