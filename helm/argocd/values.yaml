
server:
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.dev.appledore.in
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/whitelist-source-range: "58.84.62.245/32"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    extraTls:
      - hosts:
          - argocd.dev.appledore.in
        secretName: argocd-dev-appledore-tls
