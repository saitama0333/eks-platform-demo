replicaCount: 0
image:
  repository: 829647177071.dkr.ecr.eu-central-1.amazonaws.com/eks-platform-demo/dev/nginx-demo
  tag: "20261023150244-3119"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  hostname: dev.appledore.in
  additionalHosts:
    - appledore.in
    - www.appledore.in
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    secretName: nginx-demo-dev-appledore-tls

containerPort: 8080

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi
